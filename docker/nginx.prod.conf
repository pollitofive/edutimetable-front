server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se vea al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: vue-router usa history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
